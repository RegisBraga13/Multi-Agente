name: backend

on:
  push:
    paths: ["backend/**", "supabase/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "supabase/**", ".github/workflows/backend.yml"]

jobs:
  checagens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app casos_de_teste
      - run: pytest -q  # os testes "banco" usam o Docker do runner
