versao_formato: 2
id: derm-020-anamnese-incompleta
especialidade: dermatologia
titulo: Anamnese incompleta (manchas claras no peito)
objetivo: Dados incompletos — nada pode ser inventado; hipótese explicitada como incerta; pedir duração, sintomas e distribuição; extensão não examinada fica desconhecida.
revisao: {situacao: pendente}
entrada:
  paciente: {idade: 50, sexo: M}
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Tenho umas manchas claras no peito."}
    - {quem: Médico, texto: "Desde quando?"}
    - {quem: Paciente, texto: "Não sei dizer."}
    - {quem: Médico, texto: "Vou olhar o peito."}
  exame:
    morfologia: Máculas hipocrômicas com descamação fina
    localizacao: Tórax anterior
    extensao: null
    gravidade: null
    achados: null
esperado:
  historia:
    fatos:
      - Manchas claras no peito, de duração que o paciente não sabe informar
      - Máculas hipocrômicas com descamação fina no tórax anterior
    desconhecidos: [duração, sintomas (prurido), distribuição completa, extensão, gravidade e achados associados (não examinados), medicamentos, antecedentes]
    vazias: [ap, hp, hf, exames]
  diagnosticos:
    principal: {nome: Pitiríase versicolor, cid: B36.0, certeza: hipotese}
  sinais: {disparados: []}
  conduta:
    protocolo: micose-superficial
    urgencia: rotina
    obrigatorios:
      - Explicitar a incerteza diagnóstica
      - Pedir duração, sintomas e distribuição completa
      - Propor exame complementar se necessário (ex. exame micológico direto)
    proibidos:
      - Registrar a extensão como ausência de outras lesões (não foi examinada)
      - Registrar negativas que não foram perguntadas
