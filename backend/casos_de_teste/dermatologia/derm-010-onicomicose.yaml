versao_formato: 2
id: derm-010-onicomicose
especialidade: dermatologia
titulo: Suspeita de onicomicose do hálux
objetivo: Suspeita clínica que exige confirmação micológica antes de antifúngico oral; descamação interdigital como possível tinha dos pés; diabetes negado.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente: {idade: 41, sexo: M}
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Unha do pé grossa e amarelada há 1 ano."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Jogo bola toda semana e uso o vestiário."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Não dói, só incomoda o aspecto."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Não, nenhum."}
    - {quem: Médico, texto: "Tem diabetes ou problema de circulação?"}
    - {quem: Paciente, texto: "Não tenho."}
    - {quem: Médico, texto: "Vou olhar as unhas dos pés."}
  sinais:
    - {sinal: pe-diabetico, resposta: f}
  exame:
    morfologia: Espessamento e amarelamento da lâmina ungueal
    localizacao: Hálux direito
    extensao: Uma unha acometida
    gravidade: Leve
    achados: Descamação entre os dedos
esperado:
  historia:
    fatos:
      - Unha do hálux direito espessada e amarelada há 1 ano, sem dor
      - Futebol semanal com uso de vestiário coletivo
      - Descamação interdigital
    negativas: [diabetes ou problema de circulação, uso de medicamentos]
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Onicomicose, cid: B35.1, certeza: suspeita}
    rastrear:
      - "Tinha dos pés: avaliar a descamação interdigital"
  sinais: {disparados: []}
  conduta:
    protocolo: onicomicose
    urgencia: rotina
    obrigatorios:
      - Confirmação micológica (exame micológico direto e/ou cultura) antes de antifúngico oral
      - Avaliar e tratar a descamação interdigital como possível tinha dos pés
    proibidos:
      - Antifúngico oral sem confirmação micológica
      - Registrar diabetes (o paciente negou)
