versao_formato: 2
id: derm-007-rosacea
especialidade: dermatologia
titulo: Rosácea eritematotelangiectásica
objetivo: Rosácea com gatilhos claros; sintomas oculares negados na anamnese, sem exame ocular; conduta para eritema e telangiectasias.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente:
    idade: 46
    sexo: F
    em_uso: [Levotiroxina 50 mcg]
    antecedentes: [Hipotireoidismo]
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Vermelhidão e ardor no rosto, piora com sol e calor."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Fico vermelha com bebida quente e com o sol. Arde."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Isso já tem uns três anos."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Uso levotiroxina 50 mcg. Tenho hipotireoidismo."}
    - {quem: Médico, texto: "Sente ardor ou areia nos olhos?"}
    - {quem: Paciente, texto: "Não."}
    - {quem: Médico, texto: "Vou olhar o rosto sem maquiagem."}
  exame:
    morfologia: Eritema persistente com telangiectasias
    localizacao: Região centrofacial (bochechas e nariz)
    extensao: Face, sem pápulas
    gravidade: Leve a moderada
    achados: null
esperado:
  historia:
    fatos:
      - Vermelhidão e ardor no rosto há cerca de três anos, desencadeados por sol, calor e bebidas quentes
      - Hipotireoidismo em uso de levotiroxina
    negativas: [ardor e sensação de areia nos olhos]
    desconhecidos: [exame ocular (não realizado)]
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Rosácea, cid: L71.9, certeza: clinico}
  sinais: {disparados: []}
  conduta:
    protocolo: rosacea
    urgencia: rotina
    obrigatorios:
      - Tratamento específico para eritema e telangiectasias
      - Orientação sobre os gatilhos (sol, calor, bebidas quentes) e fotoproteção
    proibidos:
      - Tratar pápulas e pústulas que não existem
      - Registrar exame ocular normal (não foi feito)
