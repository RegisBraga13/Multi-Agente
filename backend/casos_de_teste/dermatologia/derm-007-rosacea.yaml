    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Vermelhidão e ardor no rosto, piora com sol e calor."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Fico vermelha com bebida quente e com o sol. Arde."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Isso já tem uns três anos."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Uso levotiroxina 50 mcg. Tenho hipotireoidismo."}
    - {quem: Médico, texto: "Sente ardor ou areia nos olhos?"}
    - {quem: Paciente, texto: "Não."}
    - {quem: Médico, texto: "Vou olhar o rosto sem maquiagem."}
