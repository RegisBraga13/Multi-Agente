versao_formato: 2
id: derm-006-alopecia-androgenetica
especialidade: dermatologia
titulo: Alopecia androgenética
objetivo: Calvície de padrão masculino com história familiar; finasterida só com discussão de efeitos adversos e decisão médica.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente: {idade: 30, sexo: M}
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Queda de cabelo nas entradas há 2 anos."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Meu pai também é calvo. Cai mais no banho."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Não tive doença nem fiz dieta nos últimos meses."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Não, nenhum."}
    - {quem: Médico, texto: "Vou olhar o couro cabeludo com o aparelho."}
  exame:
    morfologia: Rarefação de fios com miniaturização
    localizacao: Regiões frontotemporais e vértice
    extensao: Padrão masculino, Hamilton-Norwood III vértice
    gravidade: Moderada
    achados: Couro cabeludo sem descamação
esperado:
  historia:
    fatos:
      - Queda de cabelo nas entradas há 2 anos, mais notada no banho
      - Miniaturização em regiões frontotemporais e vértice (Hamilton-Norwood III vértice)
      - "HF: pai com calvície"
    negativas: [doença ou dieta restritiva recentes, uso de medicamentos]
    vazias: [exames]
  diagnosticos:
    principal: {nome: Alopecia androgenética, cid: L64.9, certeza: clinico}
    rastrear:
      - "Eflúvio telógeno: investigar se houver perda difusa importante (queda no banho)"
  sinais: {disparados: []}
  conduta:
    protocolo: alopecia-androgenetica
    urgencia: rotina
    obrigatorios:
      - Tratamento para alopecia androgenética conforme a tabela
      - Se sugerir finasterida, discutir efeitos adversos e deixar a decisão com o médico
