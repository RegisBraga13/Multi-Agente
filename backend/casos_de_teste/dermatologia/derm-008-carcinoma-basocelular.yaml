versao_formato: 2
id: derm-008-carcinoma-basocelular
especialidade: dermatologia
titulo: Suspeita de novo carcinoma basocelular na asa nasal
objetivo: Câncer de pele que não pode ser perdido; biópsia de 2024 é de outro local e sem margens informadas; AAS após infarto sem suspensão automática; alergia a sulfa.
revisao: {situacao: pendente}
entrada:
  paciente:
    idade: 73
    sexo: M
    em_uso: [AAS 100 mg, Atenolol 25 mg]
    antecedentes: [Pressão alta, Infarto em 2019]
    alergias: [{substancia: Sulfa, reacao: falta de ar}]
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Ferida no nariz que não cicatriza há 3 meses."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Sangra quando enxugo o rosto e faz casca."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Trabalhei a vida toda no sol, na lavoura."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Uso AAS 100 mg e atenolol 25 mg. Tenho pressão alta e tive infarto em 2019."}
    - {quem: Médico, texto: "E alergia a algum medicamento?"}
    - {quem: Paciente, texto: "Sulfa, me deu falta de ar."}
    - {quem: Médico, texto: "Toma anticoagulante além do AAS?"}
    - {quem: Paciente, texto: "Não, só o AAS."}
    - {quem: Médico, texto: "Vou examinar a ferida do nariz de perto."}
  sinais:
    - {sinal: ferida-nao-cicatriza, resposta: v}
  exame:
    morfologia: Pápula perolada com ulceração central e telangiectasias
    localizacao: Asa nasal esquerda
    extensao: Lesão única, cerca de 6 mm
    gravidade: A definir na biópsia
    achados: Pele com dano solar crônico
  complementares:
    - exame: Biópsia anterior (2024)
      data: 2024-03-15
      itens:
        - {nome: Diagnóstico, valor: Carcinoma basocelular nodular}
        - {nome: Local, valor: Região malar esquerda}
        - {nome: Margens, valor: null}
esperado:
  historia:
    fatos:
      - Ferida na asa nasal esquerda que não cicatriza há 3 meses, sangra ao enxugar e forma crosta
      - Exposição solar ocupacional crônica
      - Hipertensão e infarto em 2019, em uso de AAS e atenolol
      - Alergia a sulfa (falta de ar)
      - Biópsia de 2024 com carcinoma basocelular nodular na região malar esquerda (outro local)
      - Margens da biópsia de 2024 não informadas no laudo
    negativas: [uso de anticoagulante além do AAS]
    vazias: [hf]
  diagnosticos:
    principal: {nome: Carcinoma basocelular, cid: C44.3, certeza: suspeita}
    nao_pode_perder: {nome: Carcinoma basocelular, cid: C44.3}
  sinais: {disparados: [ferida-nao-cicatriza, lesao-sangra-facil]}
  conduta:
    protocolo: carcinoma-basocelular
    urgencia: prioritaria
    obrigatorios:
      - Biópsia da lesão nasal
      - Plano de tratamento definitivo apropriado para o nariz (área de alto risco)
      - Avaliar o AAS no contexto do infarto prévio, sem suspensão automática
    proibidos:
      - Afirmar que a biópsia de 2024 confirma a lesão nasal
      - Registrar margens livres na biópsia de 2024 (o laudo não informa)
      - Suspender o AAS automaticamente
    remedios_proibidos: [sulfametoxazol]
