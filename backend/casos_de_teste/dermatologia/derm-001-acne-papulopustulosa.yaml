versao_formato: 2
id: derm-001-acne-papulopustulosa
especialidade: dermatologia
titulo: Acne papulopustulosa
objetivo: Quadro típico de acne em mulher que usa anticoncepcional; gravidade moderada ainda a confirmar.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente: {idade: 34, sexo: F, em_uso: [Etinilestradiol + levonorgestrel (anticoncepcional oral)]}
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Espinhas no rosto e nas costas há 6 meses, piora antes da menstruação."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Fico mexendo nelas. Minha pele é muito oleosa."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Nunca tratei. Não tenho febre."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Uso anticoncepcional, etinilestradiol com levonorgestrel."}
    - {quem: Médico, texto: "Está grávida ou amamentando?"}
    - {quem: Paciente, texto: "Não."}
    - {quem: Médico, texto: "Planeja engravidar nos próximos meses?"}
    - {quem: Paciente, texto: "Não planejo."}
    - {quem: Médico, texto: "Sua menstruação é irregular ou tem excesso de pelos?"}
    - {quem: Paciente, texto: "A menstruação é regular e não tenho excesso de pelos."}
    - {quem: Médico, texto: "Vou olhar o rosto e as costas com a luz."}
  sinais:
    - {sinal: acne-grave-nodulos-cicatrizes, resposta: f}
    - {sinal: virilizacao, resposta: f}
    - {sinal: gestacao-ou-suspeita, resposta: f}
    - {sinal: plano-gravidez, resposta: f}
  exame:
    morfologia: Pápulas, pústulas e comedões
    localizacao: Região mandibular e malar; dorso
    extensao: 7 lesões na face; dorso esparso
    gravidade: Moderada, a confirmar
    achados: Sem cicatrizes
esperado:
  historia:
    fatos:
      - Espinhas no rosto e nas costas há 6 meses, com piora antes da menstruação
      - Pele oleosa e manipulação das lesões
      - Sem tratamento prévio
      - Uso de anticoncepcional oral (etinilestradiol + levonorgestrel)
    negativas: [febre, gravidez, amamentação, plano de engravidar, irregularidade menstrual e excesso de pelos]
    desconhecidos: [história familiar]
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Acne vulgar, cid: L70.0, certeza: clinico}
  sinais: {disparados: []}
  conduta:
    protocolo: acne
    urgencia: rotina
    obrigatorios:
      - Tratamento tópico para acne com pápulas, pústulas e comedões, conforme a tabela
    proibidos:
      - Tratar a gravidade como moderada confirmada (está a confirmar)
      - Atribuir ao anticoncepcional efeito de tratamento já instituído para a acne
