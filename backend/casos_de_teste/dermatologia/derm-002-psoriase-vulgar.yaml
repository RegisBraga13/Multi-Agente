versao_formato: 2
id: derm-002-psoriase-vulgar
especialidade: dermatologia
titulo: Psoríase vulgar
objetivo: Quadro típico de psoríase em placas; rastrear artrite psoriásica e registrar a negativa, sem diagnosticá-la; alergia a dipirona.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente:
    idade: 52
    sexo: M
    estado_civil: casado
    profissao: comerciante
    em_uso: [Losartana 50 mg 1x ao dia]
    antecedentes: [Pressão alta]
    alergias: [{substancia: Dipirona, reacao: inchaço no rosto}]
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Placas vermelhas com descamação nos cotovelos e joelhos."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Começou há uns dois anos e melhora no verão. Coça um pouco."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Já passei pomada de cortisona, melhora e volta."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Uso losartana 50 mg, 1x ao dia. Tenho pressão alta."}
    - {quem: Médico, texto: "E alergia a algum medicamento?"}
    - {quem: Paciente, texto: "Dipirona, me deu inchaço no rosto."}
    - {quem: Médico, texto: "Tem dor ou inchaço nas articulações?"}
    - {quem: Paciente, texto: "Não, nenhum."}
    - {quem: Médico, texto: "Deixa eu ver os cotovelos, os joelhos e as unhas."}
  exame:
    morfologia: Placas eritematosas bem delimitadas com escamas prateadas
    localizacao: Cotovelos e joelhos, simétricas
    extensao: Cerca de 4% da superfície corporal
    gravidade: Leve a moderada
    achados: Unhas sem depressões
  complementares:
    - exame: Exames laboratoriais
      data: 2026-09-20
      itens:
        - {nome: TGO / TGP, valor: 28 / 31 U/L}
        - {nome: Colesterol total, valor: 214 mg/dL}
esperado:
  historia:
    fatos:
      - Placas descamativas em cotovelos e joelhos há cerca de dois anos, com melhora no verão e prurido leve
      - Uso prévio de corticoide tópico com melhora parcial e recidiva
      - Hipertensão em uso de losartana
      - Alergia a dipirona (inchaço no rosto)
      - Colesterol total 214 mg/dL e TGO/TGP normais
    negativas: [dor ou inchaço articular]
    desconhecidos: [rigidez matinal, dactilite, dor no calcanhar]
    vazias: [hf]
  diagnosticos:
    principal: {nome: Psoríase vulgar, cid: L40.0, certeza: clinico}
    rastrear:
      - "Artrite psoriásica: perguntar também rigidez matinal, dactilite e dor no calcanhar; registrar a negativa atual de dor e inchaço articular"
  sinais: {disparados: []}
  conduta:
    protocolo: psoriase
    urgencia: rotina
    obrigatorios:
      - Tratamento tópico para psoríase em placas com cerca de 4% da superfície, conforme a tabela
    proibidos:
      - Diagnosticar artrite psoriásica (o paciente negou dor e inchaço articular)
    remedios_proibidos: [dipirona]
