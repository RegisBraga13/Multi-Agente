versao_formato: 2
id: derm-004-melanoma-suspeito
especialidade: dermatologia
titulo: Lesão pigmentada suspeita de melanoma
objetivo: Câncer de pele que não pode ser perdido nem dado como confirmado antes da histopatologia; dermatoscopia sem resultado; HbA1c não confirmada.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente:
    idade: 64
    sexo: M
    em_uso: [Metformina 850 mg 2x ao dia, Sinvastatina 20 mg]
    antecedentes: [Diabetes, Colesterol alto]
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Pinta nas costas que mudou de cor e cresceu."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Notei há uns seis meses. Às vezes coça, nunca sangrou."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Tomei muito sol na roça quando era jovem."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Uso metformina 850 mg, 2x ao dia e sinvastatina 20 mg. Tenho diabetes e colesterol alto."}
    - {quem: Médico, texto: "Alguém na família teve câncer de pele?"}
    - {quem: Paciente, texto: "Que eu saiba, não."}
    - {quem: Médico, texto: "Vou examinar a pinta com o dermatoscópio."}
  sinais:
    - {sinal: lesao-pigmentada-abcde, resposta: v}
  exame:
    morfologia: Lesão pigmentada assimétrica, bordas irregulares, duas tonalidades
    localizacao: Dorso, região escapular direita
    extensao: Lesão única, cerca de 8 mm
    gravidade: A definir na dermatoscopia
    achados: Outros nevos sem atipia
  complementares:
    - exame: Exames laboratoriais
      data: 2026-10-02
      itens:
        - {nome: Glicemia de jejum, valor: 132 mg/dL}
        - {nome: Hemoglobina glicada, valor: "7,1 % (lido de imagem borrada; conferir no laudo)"}
        - {nome: Creatinina, valor: "0,9 mg/dL"}
esperado:
  historia:
    fatos:
      - Lesão pigmentada no dorso que mudou de cor e cresceu, percebida há cerca de seis meses, com prurido ocasional
      - Exposição solar intensa na juventude
      - Diabetes e colesterol alto, em uso de metformina e sinvastatina
      - Hemoglobina glicada 7,1% registrada como valor não confirmado (imagem borrada)
      - "HF: sem história familiar conhecida de câncer de pele"
    negativas: [sangramento da lesão]
    desconhecidos: [resultado da dermatoscopia]
  diagnosticos:
    principal: {nome: Melanoma do tronco, cid: C43.5, certeza: suspeita}
    nao_pode_perder: {nome: Melanoma do tronco, cid: C43.5}
  sinais: {disparados: [lesao-pigmentada-abcde]}
  conduta:
    protocolo: melanoma-suspeito
    urgencia: prioritaria
    obrigatorios:
      - Biópsia apropriada da lesão (excisional), sem atrasar pela dermatoscopia
      - Registrar como suspeita até a histopatologia
    proibidos:
      - Registrar melanoma como diagnóstico confirmado antes da histopatologia
      - Atribuir achados dermatoscópicos (a dermatoscopia não tem resultado)
