versao_formato: 2
id: derm-019-escabiose
especialidade: dermatologia
titulo: Escabiose com contactantes em casa
objetivo: Tratamento simultâneo dos conviventes, com esquema adequado à idade e ao peso das crianças; filhos com o mesmo quadro são história de contato (HDA), não HF.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente: {idade: 30, sexo: F}
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Coceira no corpo todo há 3 semanas, pior à noite."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Não consigo dormir de tanta coceira. Meus dois filhos estão com a mesma coisa."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Não, nenhum."}
    - {quem: Médico, texto: "Está grávida ou amamentando?"}
    - {quem: Paciente, texto: "Não."}
    - {quem: Médico, texto: "Planeja engravidar?"}
    - {quem: Paciente, texto: "Não."}
    - {quem: Médico, texto: "Vou olhar as mãos, os punhos e as axilas."}
  sinais:
    - {sinal: gestacao-ou-suspeita, resposta: f}
  exame:
    morfologia: Pápulas escoriadas e túneis lineares
    localizacao: Espaços interdigitais, punhos, axilas e cintura
    extensao: Disseminada, poupando a face
    gravidade: Moderada
    achados: Escoriações de coçar
esperado:
  historia:
    fatos:
      - Prurido generalizado há 3 semanas, com piora noturna e prejuízo do sono
      - Dois filhos com o mesmo quadro (história de contato, na HDA)
    negativas: [gravidez, amamentação, plano de engravidar, uso de medicamentos]
    desconhecidos: [idade e peso dos filhos]
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Escabiose, cid: B86, certeza: clinico}
  sinais: {disparados: []}
  conduta:
    protocolo: escabiose
    urgencia: rotina
    obrigatorios:
      - Avaliação e tratamento simultâneo dos conviventes próximos
      - Esquema para as crianças adequado à idade e ao peso
      - Orientação sobre roupas e roupa de cama (lavar a quente ou isolar)
