versao_formato: 2
id: derm-012-verrugas-vulgares
especialidade: dermatologia
titulo: Verrugas vulgares nos dedos
objetivo: Menor de idade (14 anos) que rói as unhas, com lesões periungueais; tratamento escolhido por idade, dor e preferência, sem procedimento destrutivo imediato obrigatório.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente: {idade: 14, sexo: M}
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Verrugas nos dedos das mãos."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Apareceram há uns três meses e estão aumentando."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Minha mãe diz que eu roo a unha."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Não, nenhum."}
    - {quem: Médico, texto: "Alguém em casa tem verrugas?"}
    - {quem: Paciente, texto: "Não."}
    - {quem: Médico, texto: "Vou olhar os dedos de perto."}
  exame:
    morfologia: Pápulas hiperceratósicas de superfície rugosa
    localizacao: Dedos das mãos; 2 lesões periungueais (indicador e médio direitos), 3 no dorso dos dedos
    extensao: 5 lesões
    gravidade: Leve
    achados: Pontos escuros na superfície
esperado:
  historia:
    fatos:
      - Verrugas nos dedos das mãos há cerca de três meses, em aumento
      - Hábito de roer as unhas
      - Duas lesões periungueais
    negativas: [contatos domiciliares com verrugas, uso de medicamentos]
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Verruga vulgar, cid: B07, certeza: clinico}
  sinais: {disparados: []}
  conduta:
    protocolo: verrugas
    urgencia: rotina
    obrigatorios:
      - Comparar ácido salicílico e crioterapia considerando idade, dor e preferência
      - Orientar parar de roer as unhas (lesões periungueais)
    proibidos:
      - Exigir procedimento destrutivo de imediato
