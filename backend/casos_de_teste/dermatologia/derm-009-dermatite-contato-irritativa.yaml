versao_formato: 2
id: derm-009-dermatite-contato-irritativa
especialidade: dermatologia
titulo: Dermatite de contato irritativa das mãos
objetivo: Quadro ocupacional (cozinheira) que melhora no afastamento; proteção das mãos detalhada, não só "luvas"; alternativas se não melhorar.
revisao: {situacao: pendente}
entrada:
  paciente:
    idade: 25
    sexo: F
    antecedentes: [Rinite]
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Coceira e bolinhas nas mãos, piora ao lavar louça."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Começou quando fui trabalhar de cozinheira, há quatro meses."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Melhora nas férias."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Não, nenhum. Tenho rinite."}
    - {quem: Médico, texto: "Usa luvas para lavar louça?"}
    - {quem: Paciente, texto: "Não uso."}
    - {quem: Médico, texto: "Me mostra as duas mãos, por favor."}
  exame:
    morfologia: Vesículas e descamação com fissuras
    localizacao: Dorso e palmas das mãos
    extensao: Ambas as mãos
    gravidade: Moderada
    achados: Pele ressecada, sem sinais de infecção
esperado:
  historia:
    fatos:
      - Prurido e vesículas nas mãos há quatro meses, desde que começou a trabalhar como cozinheira, com piora ao lavar louça
      - Melhora no afastamento do trabalho (férias)
      - Não usa luvas
      - Rinite
    negativas: [uso de medicamentos]
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Dermatite de contato irritativa, cid: L24.9, certeza: clinico}
    rastrear:
      - "Dermatite de contato alérgica ou eczema das mãos: reavaliar (considerar teste de contato) se não houver melhora"
  sinais: {disparados: []}
  conduta:
    protocolo: dermatite-contato
    urgencia: rotina
    obrigatorios:
      - Reduzir o trabalho úmido
      - Luva adequada ao agente de exposição, evitando umidade prolongada dentro dela (ex. forro de algodão)
      - Hidratação frequente da pele das mãos
