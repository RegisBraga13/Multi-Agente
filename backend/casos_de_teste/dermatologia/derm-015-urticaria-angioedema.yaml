versao_formato: 2
id: derm-015-urticaria-angioedema
especialidade: dermatologia
titulo: Urticária aguda com edema labial
objetivo: Sinal de alerta grave; não basta mencionar anti-histamínico — exige avaliação imediata de via aérea e sinais de anafilaxia; edema labial isolado não prova anafilaxia nem alergia a camarão.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente: {idade: 31, sexo: M}
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Placas vermelhas que coçam muito pelo corpo desde ontem, depois que comi camarão."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Elas somem e aparecem em outro lugar. Hoje cedo os lábios incharam."}
    - {quem: Médico, texto: "Está com falta de ar ou a língua inchada?"}
    - {quem: Paciente, texto: "Falta de ar não. A língua está normal."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Não, nenhum."}
    - {quem: Médico, texto: "Vou olhar a pele e a boca."}
  sinais:
    - {sinal: angioedema, resposta: v}
  exame:
    morfologia: Urticas eritematoedematosas de tamanhos variados
    localizacao: Tronco e membros; edema de lábios
    extensao: Disseminada
    gravidade: Moderada
    achados: Edema labial, sem edema de língua; sem estridor
esperado:
  historia:
    fatos:
      - Urticas pruriginosas fugazes pelo corpo desde ontem, após comer camarão
      - Edema dos lábios hoje cedo
    negativas: [falta de ar, edema de língua, uso de medicamentos]
    desconhecidos: [intervalo entre o camarão e o início, rouquidão, dificuldade para engolir, sintomas gastrointestinais, pressão arterial]
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Urticária aguda, cid: L50.0, certeza: hipotese}
    nao_pode_perder: {nome: Angioedema, cid: T78.3}
  sinais: {disparados: [angioedema]}
  conduta:
    protocolo: urticaria
    urgencia: imediata
    obrigatorios:
      - Avaliar na hora via aérea, voz, deglutição, respiração, pressão arterial e sintomas gastrointestinais
      - Se suspeita de anafilaxia, adrenalina intramuscular e emergência
      - Esclarecer o intervalo e a evolução após o camarão antes de afirmar alergia alimentar
    proibidos:
      - Conduta só com anti-histamínico, sem avaliar via aérea e sinais de anafilaxia
      - Diagnosticar anafilaxia só pelo edema labial
      - Afirmar alergia a camarão como confirmada
