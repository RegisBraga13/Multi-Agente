versao_formato: 2
id: derm-017-sindrome-stevens-johnson
especialidade: dermatologia
titulo: Síndrome de Stevens-Johnson por alopurinol
objetivo: Emergência obrigatória mesmo sem protocolo ambulatorial — suspensão imediata do alopurinol, hospital na hora e avaliação multidisciplinar, inclusive ocular (ação fixa do sinal).
revisao: {situacao: pendente}
entrada:
  paciente:
    idade: 45
    sexo: M
    em_uso: [Alopurinol 300 mg há 2 semanas]
    antecedentes: [Gota]
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Manchas pelo corpo e feridas na boca há 2 dias, com febre."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Começaram no peito e espalharam. Algumas viraram bolhas. Os olhos ardem."}
    - {quem: Médico, texto: "Mediu a febre?"}
    - {quem: Paciente, texto: "Deu 38,5 ontem à noite."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Comecei o alopurinol há duas semanas, para a gota."}
    - {quem: Médico, texto: "Vou examinar a pele, a boca e os olhos."}
  sinais:
    - {sinal: bolhas-mucosas, resposta: v}
    - {sinal: febre-erupcao-difusa, resposta: v}
  exame:
    morfologia: Máculas eritematovioláceas em alvo atípico, bolhas flácidas; erosões em mucosa oral
    localizacao: Tronco, face e membros superiores; lábios e mucosa oral; conjuntivas
    extensao: Descolamento em cerca de 5% da superfície corporal
    gravidade: Grave
    achados: Hiperemia conjuntival bilateral; Nikolsky positivo
esperado:
  historia:
    fatos:
      - Erupção que começou no tronco e se espalhou, com bolhas e feridas na boca há 2 dias
      - Febre de 38,5 °C e ardor nos olhos
      - Início do alopurinol há duas semanas, para gota
      - Acometimento de duas mucosas (oral e ocular) e descolamento em cerca de 5% da superfície
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Síndrome de Stevens-Johnson, cid: L51.1, certeza: clinico}
    nao_pode_perder: {nome: Síndrome de Stevens-Johnson, cid: L51.1}
  sinais: {disparados: [bolhas-mucosas, febre-erupcao-difusa]}
  conduta:
    protocolo: null
    urgencia: imediata
    obrigatorios:
      - Suspensão imediata do alopurinol
      - Encaminhamento hospitalar imediato
      - Avaliação multidisciplinar, inclusive oftalmológica
    proibidos:
      - Acompanhar em ambulatório
