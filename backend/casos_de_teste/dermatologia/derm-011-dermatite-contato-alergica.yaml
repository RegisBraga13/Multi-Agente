versao_formato: 2
id: derm-011-dermatite-contato-alergica
especialidade: dermatologia
titulo: Dermatite de contato no antebraço
objetivo: Sequência temporal com sabão novo favorece dermatite de contato, sem distinguir alérgica de irritativa; investigar o contato e considerar teste de contato; alergia a dipirona.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente:
    idade: 57
    sexo: F
    em_uso: [Losartana 50 mg 1x ao dia]
    antecedentes: [Pressão alta]
    alergias: [{substancia: Dipirona, reacao: inchaço no rosto}]
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Manchas vermelhas no braço que coçam, há 3 semanas."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Começou depois que troquei o sabão em pó."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Coça mais à noite."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Uso losartana 50 mg, 1x ao dia. Tenho pressão alta."}
    - {quem: Médico, texto: "E alergia a algum medicamento?"}
    - {quem: Paciente, texto: "Dipirona, me deu inchaço no rosto."}
    - {quem: Médico, texto: "Começou algum remédio ou creme novo?"}
    - {quem: Paciente, texto: "Não, só o sabão mesmo."}
    - {quem: Médico, texto: "Vou olhar o braço com a luz."}
  exame:
    morfologia: Placas eritematosas com escoriações
    localizacao: Face anterior do antebraço direito
    extensao: Uma área de cerca de 5 cm
    gravidade: Leve
    achados: Sem vesículas; escoriações de coçar
esperado:
  historia:
    fatos:
      - Placas eritematosas pruriginosas no antebraço direito há 3 semanas, após troca do sabão em pó, com piora noturna
      - Hipertensão em uso de losartana
      - Alergia a dipirona (inchaço no rosto)
    negativas: [medicamento ou creme novo]
    desconhecidos: [como o antebraço entra em contato com o produto]
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Dermatite de contato alérgica, cid: L23.9, certeza: hipotese}
    aceitos:
      - {nome: Dermatite de contato irritativa, cid: L24.9}
  sinais: {disparados: []}
  conduta:
    protocolo: dermatite-contato
    urgencia: rotina
    obrigatorios:
      - Investigar o contato do antebraço com o produto (ex. roupa lavada com o sabão novo)
      - Afastar o sabão suspeito
      - Considerar teste de contato se persistir ou recorrer
    remedios_proibidos: [dipirona]
