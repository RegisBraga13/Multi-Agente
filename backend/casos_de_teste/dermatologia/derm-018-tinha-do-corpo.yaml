versao_formato: 2
id: derm-018-tinha-do-corpo
especialidade: dermatologia
titulo: Tinha do corpo que piorou com corticoide
objetivo: Erro clássico — nenhum corticoide tópico, isolado ou com antifúngico; registrar a piora com corticoide; virilha examinada sem lesões.
revisao: {situacao: pendente}
entrada:
  paciente: {idade: 22, sexo: M}
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Mancha redonda que coça na coxa, há 1 mês."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Passei uma pomada de cortisona que tinha em casa. Melhorou a coceira, mas a mancha cresceu."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Tenho um gato em casa e treino na academia."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Só a pomada."}
    - {quem: Médico, texto: "Vou olhar a coxa e a virilha."}
  exame:
    morfologia: Placa anular eritematosa com borda descamativa e centro mais claro
    localizacao: Face interna da coxa direita
    extensao: Uma placa de cerca de 6 cm
    gravidade: Leve
    achados: Borda ativa com descamação; virilha examinada, sem lesões
esperado:
  historia:
    fatos:
      - Placa pruriginosa na coxa há 1 mês
      - Uso de pomada de corticoide caseira, com melhora do prurido e crescimento da lesão
      - Gato em casa e academia
      - Virilha sem lesões
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Tinha do corpo, cid: B35.4, certeza: clinico}
  sinais: {disparados: []}
  conduta:
    protocolo: micose-superficial
    urgencia: rotina
    obrigatorios:
      - Antifúngico tópico
      - Suspender o corticoide tópico
      - Considerar exame micológico se houver dúvida diagnóstica
    proibidos:
      - Qualquer corticoide tópico, isolado ou em combinação com antifúngico
    remedios_proibidos: [clobetasol, betametasona, mometasona, hidrocortisona, dexametasona, desonida, triancinolona, prednicarbato, fluocinolona]
