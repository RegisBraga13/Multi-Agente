versao_formato: 2
id: derm-016-herpes-zoster-oftalmico
especialidade: dermatologia
titulo: Herpes-zóster oftálmico
objetivo: Sinal de alerta grave; antiviral sistêmico imediato e avaliação oftalmológica urgente (olho vermelho já é achado ocular); imunossupressão perguntada por completo.
revisao: {situacao: aprovado, em: 2026-11-18}
entrada:
  paciente:
    idade: 68
    sexo: F
    em_uso: [Anlodipino 5 mg]
    antecedentes: [Pressão alta]
  falas:
    - {quem: Médico, texto: "Bom dia! Me conta o que trouxe você aqui hoje."}
    - {quem: Paciente, texto: "Bolhas na testa do lado direito que doem muito, há 2 dias."}
    - {quem: Médico, texto: "Desde quando? Piora com alguma coisa?"}
    - {quem: Paciente, texto: "Antes das bolhas, a testa queimava por uns três dias. Agora o olho direito está vermelho."}
    - {quem: Médico, texto: "Mais alguma coisa que eu deva saber?"}
    - {quem: Paciente, texto: "Apareceu uma bolhinha na ponta do nariz hoje."}
    - {quem: Médico, texto: "Está usando algum remédio?"}
    - {quem: Paciente, texto: "Uso anlodipino 5 mg. Tenho pressão alta."}
    - {quem: Médico, texto: "Fez transplante, quimioterapia, tem HIV ou usa corticoide ou outro remédio que baixa a imunidade?"}
    - {quem: Paciente, texto: "Não, nada disso."}
    - {quem: Médico, texto: "Vou olhar a testa, o nariz e o olho."}
  sinais:
    - {sinal: zoster-oftalmico, resposta: v}
    - {sinal: imunossupressao, resposta: f}
  exame:
    morfologia: Vesículas agrupadas sobre base eritematosa
    localizacao: Fronte direita e ponta do nariz, sem passar a linha média
    extensao: Dermátomo V1 à direita
    gravidade: Moderada
    achados: Hiperemia conjuntival à direita
esperado:
  historia:
    fatos:
      - Vesículas dolorosas na fronte direita há 2 dias, precedidas de dor em queimação por três dias
      - Vesícula na ponta do nariz e olho direito vermelho
      - Hipertensão em uso de anlodipino
    negativas: [transplante, quimioterapia, HIV, uso de corticoide ou imunossupressor]
    desconhecidos: [acuidade visual, dor ocular, fotofobia]
    vazias: [hf, exames]
  diagnosticos:
    principal: {nome: Herpes-zóster oftálmico, cid: B02.3, certeza: clinico}
    nao_pode_perder: {nome: Herpes-zóster oftálmico, cid: B02.3}
  sinais: {disparados: [zoster-oftalmico]}
  conduta:
    protocolo: herpes-zoster
    urgencia: imediata
    obrigatorios:
      - Antiviral sistêmico iniciado imediatamente
      - Avaliação oftalmológica urgente (olho vermelho já é achado ocular)
    proibidos:
      - Esperar perda visual para encaminhar ao oftalmologista
