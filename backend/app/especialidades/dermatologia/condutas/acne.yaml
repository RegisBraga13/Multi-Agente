# Protocolo de conduta: acne (Dermatologia). Fonte única da tabela (desenho §6): o frontend passa a ler daqui
# no marco 3C e a cópia em frontend/src/consulta/conduta-exemplo.ts é apagada.
# Porte fiel de conduta-exemplo.ts (grupos, opções, itens de receita). As regras do "Para relembrar" passam a
# ler os sinais de alerta da lista fixa.
# `contraindicacoes` por gestação: PROPOSTA DO ENGENHEIRO, pendente da aprovação do autor.
chave: acne
versao: 1
cids: [L70.0]
revisao:
  situacao: pendente
  nota: Contraindicações por gestação ou tentativa de gravidez propostas pelo engenheiro; regras ligadas aos sinais.

grupos:
  - id: cuidados
    rotulo: 1. Cuidados básicos
    linhas:
      - id: cuidados
        rotulo: null
        opcoes:
          - id: oleosa
            rotulo: Rotina para pele oleosa/acneica
            texto: Rotina para pele oleosa/acneica. Limpeza suave 2×/dia, hidratante não comedogênico e fotoproteção oil-free. Evitar espremer pápulas e pústulas.
            receita:
              - {nome: Sabonete facial para pele oleosa/acneica, forma: GEL, concentracao: "", quantidade: {n: 1, unidade: fr., feminino: false}, via: topico, posologia: Lavar o rosto 2 vezes ao dia (manhã e noite) e enxaguar bem., duracao: uso contínuo}
              - {nome: Hidratante facial não comedogênico, forma: gel-creme, concentracao: "", quantidade: {n: 1, unidade: bisn., feminino: true}, via: topico, posologia: "Aplicar fina camada no rosto pela manhã, após a limpeza.", duracao: uso contínuo}
              - {nome: Protetor solar facial toque seco, forma: loção, concentracao: "FPS 50", quantidade: {n: 1, unidade: fr., feminino: false}, via: topico, posologia: "Aplicar no rosto pela manhã; reaplicar a cada 2 - 3h se exposto ao sol.", duracao: uso contínuo}
          - id: sensivel
            rotulo: Rotina para pele sensível
            texto: Rotina para pele sensível. Limpeza suave 1×/dia, hidratante calmante não comedogênico e fotoproteção oil-free.
            receita:
              - {nome: Sabonete facial para pele sensível, forma: GEL, concentracao: "", quantidade: {n: 1, unidade: fr., feminino: false}, via: topico, posologia: "Lavar o rosto 1 vez ao dia, à noite, com água fria ou morna.", duracao: uso contínuo}
              - {nome: Hidratante facial calmante não comedogênico, forma: CREM, concentracao: "", quantidade: {n: 1, unidade: bisn., feminino: true}, via: topico, posologia: "Aplicar fina camada no rosto 2 vezes ao dia (manhã e noite), se houver ressecamento.", duracao: uso contínuo}
              - {nome: Protetor solar facial mineral, forma: loção, concentracao: "FPS 50", quantidade: {n: 1, unidade: fr., feminino: false}, via: topico, posologia: "Aplicar no rosto pela manhã; reaplicar a cada 2 - 3h se exposto ao sol.", duracao: uso contínuo}

  - id: topico
    rotulo: 2. Tratamento tópico
    linhas:
      - id: topico
        rotulo: null
        opcoes:
          - id: adapaleno-bpo
            rotulo: Adapaleno + peróxido de benzoíla
            texto: Adapaleno + peróxido de benzoíla. Combinação preferencial; uso noturno, conforme tolerância.
            receita:
              - {nome: Adapaleno + peróxido de benzoíla, forma: GEL, concentracao: "0,1% + 2,5%", quantidade: {n: 1, unidade: bisn. 30g, feminino: true}, via: topico, posologia: "Aplicar camada fina no rosto à noite, sobre a pele limpa e seca, evitando olhos, cantos do nariz e lábios.", duracao: 8sem}
          - id: bpo-clinda
            rotulo: Peróxido de benzoíla + clindamicina
            texto: Peróxido de benzoíla + clindamicina. Uso noturno, conforme tolerância.
            receita:
              - {nome: Peróxido de benzoíla + fosfato de clindamicina, forma: GEL, concentracao: "5% + 1%", quantidade: {n: 1, unidade: bisn. 25g, feminino: true}, via: topico, posologia: "Aplicar camada fina nas áreas com lesões à noite, sobre a pele limpa e seca, evitando olhos, cantos do nariz e lábios.", duracao: 8sem}
          - id: tretinoina-clinda
            rotulo: Tretinoína + clindamicina
            texto: Tretinoína + clindamicina. Uso noturno, conforme tolerância.
            receita:
              - {nome: Tretinoína + fosfato de clindamicina, forma: GEL, concentracao: "0,025% + 1%", quantidade: {n: 1, unidade: bisn. 30g, feminino: true}, via: topico, posologia: "Aplicar camada fina no rosto à noite, sobre a pele limpa e seca, evitando olhos, cantos do nariz e lábios.", duracao: 8sem}
          - id: azelaico
            rotulo: Ácido azelaico
            texto: Ácido azelaico. Uso 2×/dia, conforme tolerância; sem retinoide tópico.
            receita:
              - {nome: Ácido azelaico, forma: GEL, concentracao: "15%", quantidade: {n: 1, unidade: bisn. 30g, feminino: true}, via: topico, posologia: "Aplicar camada fina no rosto 2 vezes ao dia (manhã e noite), sobre a pele limpa e seca.", duracao: 8sem}
          - id: bpo
            rotulo: Peróxido de benzoíla isolado
            texto: Peróxido de benzoíla isolado. Uso noturno, conforme tolerância.
            receita:
              - {nome: Peróxido de benzoíla, forma: GEL, concentracao: "5%", quantidade: {n: 1, unidade: bisn. 60g, feminino: true}, via: topico, posologia: "Aplicar camada fina nas áreas com lesões (pode descolorir tecidos) à noite, sobre a pele limpa e seca, evitando olhos, cantos do nariz e lábios.", duracao: 8sem}
          - id: adapaleno
            rotulo: Adapaleno isolado
            texto: Adapaleno isolado. Uso noturno, conforme tolerância.
            receita:
              - {nome: Adapaleno, forma: GEL, concentracao: "0,1%", quantidade: {n: 1, unidade: bisn. 30g, feminino: true}, via: topico, posologia: "Aplicar camada fina no rosto à noite, sobre a pele limpa e seca, evitando olhos, cantos do nariz e lábios.", duracao: 8sem}

  - id: sistemico
    rotulo: 3. Tratamento sistêmico
    linhas:
      - id: sistemico
        rotulo: null
        multipla: true
        opcoes:
          - id: doxiciclina
            rotulo: Doxiciclina oral
            texto: Doxiciclina oral, associada ao tratamento tópico.
            receita:
              - {nome: Cloridrato de doxiciclina, forma: COMP, concentracao: "100mg", quantidade: {n: 56, unidade: COMP, feminino: false}, via: oral, posologia: "Tomar 1 COMP VO, 1 vez ao dia, após uma refeição e com um copo de água.", duracao: 8sem}
          - id: limeciclina
            rotulo: Limeciclina oral
            texto: Limeciclina oral, associada ao tratamento tópico.
            receita:
              - {nome: Limeciclina, forma: CAP, concentracao: "300mg", quantidade: {n: 56, unidade: CAP, feminino: true}, via: oral, posologia: "Tomar 1 CAP VO, 1 vez ao dia.", duracao: 8sem}
          - id: aco
            rotulo: Anticoncepcional combinado
            texto: Anticoncepcional combinado.
            receita:
              - {nome: Etinilestradiol + drospirenona, forma: COMP, concentracao: "0,03mg + 3mg", quantidade: {n: 2, unidade: cart. com 21 COMP, feminino: true}, via: oral, posologia: "Tomar 1 COMP VO ao dia, no mesmo horário, 21 dias com pausa de 7 dias entre as cartelas.", duracao: 8sem}
          - id: espironolactona
            rotulo: Espironolactona
            texto: Espironolactona.
            receita:
              - {nome: Espironolactona, forma: COMP, concentracao: "100mg", quantidade: {n: 30, unidade: COMP, feminino: false}, via: oral, posologia: "Tomar 1 COMP VO, 1 vez ao dia, pela manhã.", duracao: 30 dias}
          - id: isotretinoina
            rotulo: Isotretinoína oral
            texto: Isotretinoína oral.
            receita:
              - {nome: Isotretinoína, forma: CAP, concentracao: "20mg", quantidade: {n: 30, unidade: CAP, feminino: true}, via: oral, posologia: "Tomar 1 CAP VO, 1 vez ao dia, junto com uma refeição.", duracao: 30 dias, controlado: true}

  - id: orientacoes
    rotulo: 4. Orientações
    fixo: Não manipular lesões inflamatórias. Ajustar frequência conforme tolerabilidade cutânea.
    linhas:
      - id: exames
        rotulo: Exames
        opcoes:
          - {id: hormonal, rotulo: Perfil hormonal, texto: Solicito perfil hormonal.}
      - id: retorno
        rotulo: Avaliação
        opcoes:
          - {id: 4s, rotulo: 4 semanas, texto: Avaliação em 4 semanas., dias: 28}
          - {id: 8s, rotulo: 8 semanas, texto: Avaliação em 8 semanas., dias: 56}
          - {id: 12s, rotulo: 12 semanas, texto: Avaliação em 12 semanas., dias: 84}
      - id: encaminhamento
        rotulo: Encaminhamento
        prefixo: Encaminho para
        multipla: true
        opcoes:
          - {id: gineco, rotulo: Ginecologia, texto: ginecologia}
          - {id: endocrino, rotulo: Endocrinologia, texto: endocrinologia}

# Com o sinal disparado, estas opções vêm primeiro na linha (o "porquê" aparece ao médico).
regras:
  # gravidez (ou suspeita/tentativa) ou plano de engravidar: o ácido azelaico vem primeiro
  - {sinal: gestacao-ou-suspeita, linha: topico, opcoes: [azelaico]}
  - {sinal: plano-gravidez, linha: topico, opcoes: [azelaico]}
  # sinais de hiperandrogenismo: investigar (perfil hormonal e ginecologia vêm primeiro)
  - {sinal: virilizacao, linha: exames, opcoes: [hormonal]}
  - {sinal: virilizacao, linha: encaminhamento, opcoes: [gineco]}

# Com o sinal disparado, estas opções não são oferecidas; aparecem ao médico como "não indicado" com o motivo.
contraindicacoes:
  - sinal: gestacao-ou-suspeita  # só gravidez, suspeita ou tentativa (autor, 18/11); plano futuro não tira
    opcoes: [adapaleno-bpo, tretinoina-clinda, adapaleno, doxiciclina, limeciclina, espironolactona, isotretinoina, aco]
    motivo: incompatível com gestação ou tentativa de gravidez
