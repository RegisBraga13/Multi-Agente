# Ambiente local: Postgres (com o calço do auth + migrations + médico fictício) e o servidor.
#   docker compose up -d --build     → http://localhost:8000/saude  (documentação: /docs)
#   docker compose down -v           → apaga tudo (só dados fictícios)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: local
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  migracoes:
    build: .
    command: ["python", "-m", "banco_local.aplicar", "postgresql://postgres:local@db:5432/postgres"]
    volumes:
      - ../supabase:/srv/supabase:ro
    depends_on:
      db: { condition: service_healthy }

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:local@db:5432/postgres
      MEDICO_LOCAL_ID: 00000000-0000-4000-8000-000000000001
    ports: ["8000:8000"]
    depends_on:
      migracoes: { condition: service_completed_successfully }
